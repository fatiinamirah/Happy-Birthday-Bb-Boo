<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#F7E7CE;
    font-family:Arial,sans-serif;
}

.card{
    background:#FFF8F0;
    padding:35px;
    border-radius:20px;
    width:90%;
    max-width:500px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    color:#555;
    font-size:38px;
}

p{
    color:#666;
    font-size:18px;
    line-height:1.8;
}

button{

    margin-top:20px;
    background:#A67C52;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:40px;
    cursor:pointer;
    font-size:18px;

}

button:hover{
    background:#8D6E63;
}

</style>

</head>

<body>

<div class="card">

<h1>🦋 Happy Birthday ❤️</h1>

<p>
I hope this little surprise makes you smile.
Enjoy the music before opening your birthday letter. 💕
</p>

<button onclick="openPDF()">
💌 Open My Letter
</button>

</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("load", function () {

    const music = document.getElementById("music");

    document.body.addEventListener("click", function startMusic() {
        music.play();
        document.body.removeEventListener("click", startMusic);
    }, { once: true });

});

function openPDF() {
    window.open("Invitation for Birthday Massuhana.pdf", "_blank");
}

</script>

</body>
</html>
